# Netlify-Konfiguration für die Anwesenheits-App (statische PWA, kein Build nötig).
[build]
  publish = "public"

# Der Service Worker darf nie lange zwischengespeichert werden,
# sonst bekommen die iPads neue Fassungen erst viel zu spät.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Ohne den richtigen Typ nimmt Safari das Manifest nicht an
# und "Zum Home-Bildschirm" verliert Name und Symbol.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "no-cache"

# Gleiche Schutzregeln wie beim bisherigen Hoster.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
